name: Live Shopee Validation

on:
  workflow_dispatch:
    inputs:
      query:
        description: Shopee search query
        required: true
        default: ssd 2tb
      listings:
        description: Number of listings to inspect
        required: true
        default: "10"
      transport:
        description: Collector transport
        required: true
        default: http
        type: choice
        options:
          - http
          - chrome

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Install Google Chrome Stable for Playwright
        if: ${{ inputs.transport == 'chrome' }}
        run: playwright install --with-deps chrome
      - name: Collect live sample
        env:
          DEALHUNTER_CHROME_PROFILE_DIR: /tmp/dealhunter-chrome-profile
          DEALHUNTER_CHROME_HEADLESS: "true"
        run: >-
          dealhunter live-sample "${{ inputs.query }}"
          --listings "${{ inputs.listings }}"
          --transport "${{ inputs.transport }}"
          --output validation/live-shopee.csv
      - name: Upload validation CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shopee-live-validation
          path: validation/
          if-no-files-found: warn
          retention-days: 7
