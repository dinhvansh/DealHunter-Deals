<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng nhập DealHunter</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;color:#1b2533;background:#f4f7fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 0,#dff7ed 0,transparent 36%),radial-gradient(circle at 100% 100%,#e7ecff 0,transparent 34%),#f5f7fb}.shell{width:min(430px,calc(100% - 28px))}.brand{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:18px}.logo{width:42px;height:42px;border-radius:13px;background:#0f8f67;color:white;display:grid;place-items:center;font-weight:900}.card{background:#fff;border:1px solid #e3e8ef;border-radius:22px;padding:28px;box-shadow:0 20px 55px #22324b14}h1{font-size:27px;margin:0 0 6px}p{color:#728095;margin:0 0 23px;font-size:14px}.field{display:flex;flex-direction:column;gap:7px;margin:14px 0}label{font-size:13px;font-weight:800}input{border:1px solid #dce2ea;background:#fbfcfe;border-radius:12px;padding:12px 13px;font:inherit;outline:none}input:focus{border-color:#15936c;box-shadow:0 0 0 4px #15936c16;background:#fff}.btn{width:100%;margin-top:10px;border:0;border-radius:12px;padding:13px;background:#0d8e67;color:#fff;font-weight:850;cursor:pointer}.btn:disabled{opacity:.55}.msg{display:none;margin-top:14px;padding:11px 12px;border-radius:10px;font-size:13px}.msg.on{display:block;background:#fff1f1;color:#a32f2f;border:1px solid #ffd6d6}.foot{text-align:center;margin-top:14px;font-size:12px;color:#8490a1}
</style></head><body><main class="shell"><div class="brand"><div class="logo">DH</div><b>DealHunter</b></div><section class="card"><h1>Chào mừng quay lại.</h1><p>Đăng nhập tài khoản quản trị để mở Deal Radar.</p><form id="form"><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label>Mật khẩu</label><input id="password" type="password" autocomplete="current-password" required></div><button id="btn" class="btn">Đăng nhập</button><div id="msg" class="msg"></div></form></section><div class="foot">Session được lưu bằng HttpOnly cookie · không lưu password thô</div></main><script>
const next=new URLSearchParams(location.search).get('next')||'/';document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const b=document.getElementById('btn'),m=document.getElementById('msg');b.disabled=true;m.className='msg';try{const r=await fetch('/api/v1/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value})});const text=await r.text();let d={};try{d=JSON.parse(text)}catch(_){}if(!r.ok)throw new Error(typeof d.detail==='string'?d.detail:(d.detail?.message||'Đăng nhập thất bại'));location.href=next}catch(err){m.textContent=String(err);m.className='msg on';b.disabled=false}});
</script></body></html>
